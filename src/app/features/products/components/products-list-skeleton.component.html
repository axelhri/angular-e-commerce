<div class="w-full max-w-[14rem] mx-auto">
  <ngx-skeleton-loader
    [theme]="{
      'border-radius': '8px',
      'height': '160px',
      'width': '100%',
      'display': 'block',
      'margin-bottom': '12px'
    }"
  />

  <div class="p-2">
    <ngx-skeleton-loader appearance="line" [theme]="{ width: '80px', height: '16px' }" />

    <ngx-skeleton-loader appearance="line" [theme]="{ width: '100%', height: '16px' }" />

    <div class="flex justify-between items-center mt-4">
      <ngx-skeleton-loader appearance="line" [theme]="{ width: '50px', height: '20px' }" />
      <ngx-skeleton-loader appearance="line" [theme]="{ width: '80px', height: '32px', 'border-radius': '6px' }" />
    </div>
  </div>
</div>
